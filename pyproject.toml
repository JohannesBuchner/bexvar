[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bexvar"
version = "1.1.1"
description = "Bayesian excess variance for Poisson data time series with backgrounds."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Affero GNU General Public License v3"}
authors = [
    {name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com"}
]
keywords = ["bexvar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
dependencies = [
    "numpy",
    "scipy",
    "ultranest",
    "matplotlib",
    "astropy",
]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/bexvar"
Source = "https://github.com/JohannesBuchner/bexvar"
Documentation = "https://github.com/JohannesBuchner/bexvar"

[project.scripts]
bexvar_ero = "scripts.bexvar_ero:main"
quick_ero = "scripts.quick_ero:main"

[tool.setuptools]
script-files = ["scripts/bexvar_ero.py", "scripts/quick_ero.py"]

[tool.bumpversion]
current_version = "1.1.1"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "setup.py"
search = "version='{current_version}'"
replace = "version='{new_version}'"

[[tool.bumpversion.files]]
filename = "scripts/bexvar_ero.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[[tool.bumpversion.files]]
filename = "scripts/quick_ero.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[flake8]
exclude = "docs"
ignore = "E501,F401,E128,E231,E124"
style = "numpy"
check-return-types = false

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"

[tool.pycodestyle]
count = false
ignore = "W191,W291,W293,E231,E225"
max-line-length = 160
statistics = false

[tool.pydocstyle]
add-ignore = "D107"
